[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brainstem-sdk"
version = "1.0.0"
description = "Python SDK for Thunder quadruped robot"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.8"
dependencies = [
    "grpcio>=1.50.0",
    "protobuf>=4.21.0",
]

[project.optional-dependencies]
camera = [
    "opencv-python>=4.5.0",
    "numpy>=1.20.0",
]
dev = [
    "grpcio-tools>=1.50.0",
]

[tool.setuptools.packages.find]
include = ["brainstem_sdk*"]
