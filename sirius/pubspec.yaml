name: sirius
description: Sirius — Robot Dog Control
publish_to: 'none'
version: 1.1.1

environment:
  sdk: ^3.10.0

# Not a workspace member — sirius is Flutter-only and the brainstem
# monorepo workspace is plain Dart (no Flutter SDK on the robot runtime).
# For local development: `cd sirius && flutter pub get`.

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  brainstem_api:
    path: ../brainstem_api/dart
  grpc: ^5.1.0
  protobuf: ^6.0.0
  fl_chart: ^0.70.2
  path: ^1.9.0
  intl: ^0.20.0
  window_manager: ^0.4.3
  file_picker: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

