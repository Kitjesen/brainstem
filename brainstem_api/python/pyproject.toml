[tool.poetry]
name = "brainstem-api"
version = "2.0.0"
description = "Brainstem robot control API — gRPC contracts for inovxio quadruped and humanoid robots."
authors = ["Dz <MathBeWithCode@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.13"
protobuf = "6.33.0"
grpcio = "^1.76.0"


[tool.poetry.group.dev.dependencies]
grpcio-tools = "^1.76.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
