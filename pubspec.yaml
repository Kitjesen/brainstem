name: brainstem
publish_to: none

environment:
  sdk: ^3.10.0

workspace:
  - frequency_watch
  - skinny_dog_algebra
  - onnx_runtime
  - brainstem_api/dart
  - han_dog_brain
  - protoframe
  - pcan
  - serial_port
  - robo_device_proto
  - robo_device
  - han_dog
  # sirius is a Flutter package; keeping it out of the Dart workspace so
  # `dart pub get` works on environments without the Flutter SDK installed
  # (e.g. the S100P robot runtime). For local Flutter development do
  # `cd sirius && flutter pub get` directly.
  # - sirius
